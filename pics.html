<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pictures</title>
  <style>
    /* Reset & Base Styling */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #520000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      padding: 15px 0;
      overflow-x: hidden;
    }

    /* Fixed Box Wrapper for Desktop */
    .frame-container {
      position: relative;
      display: inline-block;
      margin-bottom: 25px;
    }

    /* Fixed Height for Desktop Frame */
    .main-frame {
      height: 580px; /* Fixed height for desktop */
      width: auto;
      display: block;
    }

    /* Fixed Position & Size for Song Card (Desktop) */
    .song-card {
      position: absolute;
      top: 260px;   /* Fixed vertical distance from top of frame */
      left: 270px;  /* Fixed horizontal distance from left of frame */
      width: 130px; /* Fixed width of song card */
      cursor: pointer;
      z-index: 10;
      transition: transform 0.2s ease;
      user-select: none;
    }

    .song-card:hover {
      transform: scale(1.04);
    }

    .song-card img {
      width: 100%;
      height: auto;
      display: block;
      filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.4));
    }

    /* Next Button Styling */
    .next-btn {
      padding: 12px 36px;
      font-size: 18px;
      font-weight: bold;
      color: #ffffff;
      background-color: #000000;
      border: 2px solid #000000;
      border-radius: 25px;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
      transition: transform 0.2s, background-color 0.2s;
    }

    .next-btn:hover {
      background-color: #1a1a1a;
      transform: scale(1.05);
    }

    /* ========================================================
       MOBILE FIXED PIXEL POSITIONS (Screens <= 768px)
       ======================================================== */
    @media (max-width: 768px) {
      .frame-container {
        margin-bottom: 15px;
      }

      /* Fixed Height for Mobile Frame (Occupies main portion of screen) */
      .main-frame {
        height: 500px; /* Fixed height for mobile */
      }

      /* Fixed Position & Size for Song Card on Mobile */
      .song-card {
        top: 225px;   /* Adjusted fixed top position for mobile frame height */
        left: 290px;  /* Adjusted fixed left position for mobile frame height */
        width: 120px; /* Fixed mobile song card width */
      }
    }
  </style>
</head>
<body>

  <!-- Main Image Container -->
  <div class="frame-container">
    <img class="main-frame" src="frame.png" alt="Photo Frame">

    <!-- Song Card Overlay -->
    <div class="song-card" id="songCardBtn">
      <img id="songCardImg" src="play.png" alt="Play Music">
    </div>
  </div>

  <!-- Audio Element -->
  <audio id="bgMusic" src="song.mp3" preload="auto"></audio>

  <!-- Next Page Button -->
  <a href="letter.html" class="next-btn">Next →</a>

  <script>
    const audio = document.getElementById('bgMusic');
    const songCardImg = document.getElementById('songCardImg');
    const songCardBtn = document.getElementById('songCardBtn');

    // Preload state images
    const playImg = new Image();
    playImg.src = 'play.png';
    const pauseImg = new Image();
    pauseImg.src = 'pause.png';

    // Click toggle logic
    songCardBtn.addEventListener('click', function () {
      if (audio.paused) {
        audio.play().catch(err => console.log("Playback error:", err));
      } else {
        audio.pause();
      }
    });

    // Event listeners to handle play/pause UI state changes
    audio.addEventListener('play', () => { songCardImg.src = 'pause.png'; });
    audio.addEventListener('pause', () => { songCardImg.src = 'play.png'; });
    audio.addEventListener('ended', () => { songCardImg.src = 'play.png'; });
  </script>

</body>
</html>
